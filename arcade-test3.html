<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRESS START ARCADE — BMX MAYHEM</title>
<style>
*{box-sizing:border-box}
:root{--cyan:#00e7e7;--yellow:#ffd800;--ink:#050505;--panel:#101010;--grey:#777}
html,body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{
  background:
    radial-gradient(circle at 50% 0,rgba(0,231,231,.08),transparent 34%),
    linear-gradient(#080808,#020202);
}
.arcade{max-width:1160px;margin:0 auto;padding:22px 16px 30px}

/* Cabinet body */
.cabinet{
  position:relative;
  overflow:hidden;
  background:#080808;
  border:4px solid var(--cyan);
  border-radius:18px 18px 12px 12px;
  box-shadow:
    0 0 0 6px #111,
    0 0 0 9px var(--yellow),
    0 20px 45px rgba(0,0,0,.65);
}
.cabinet:before,.cabinet:after{
  content:"";position:absolute;z-index:8;pointer-events:none;
  top:0;width:18px;height:100%;
  background:repeating-linear-gradient(0deg,#111 0 18px,#181818 18px 36px)
}
.cabinet:before{left:0;border-right:2px solid #222}
.cabinet:after{right:0;border-left:2px solid #222}

/* Arcade marquee */
.marquee{
  position:relative;text-align:center;padding:18px 54px 16px;
  border-bottom:4px solid var(--yellow);
  background:
    linear-gradient(rgba(0,0,0,.08),rgba(0,0,0,.42)),
    repeating-linear-gradient(135deg,#101010 0 22px,#161616 22px 44px);
}
.marquee:before,.marquee:after{
  content:"★";position:absolute;top:50%;transform:translateY(-50%);
  color:var(--yellow);font-size:22px;text-shadow:0 0 10px rgba(255,216,0,.4)
}
.marquee:before{left:44px}.marquee:after{right:44px}
.brand{color:var(--cyan);font:900 12px monospace;letter-spacing:5px}
.title{
  font:900 clamp(38px,6vw,70px) monospace;line-height:.9;margin:7px 0 8px;
  letter-spacing:-3px;color:#fff;
  text-shadow:4px 4px 0 #222,7px 7px 0 var(--cyan)
}
.sub{display:inline-block;color:#080808;background:var(--yellow);padding:5px 12px;font:900 11px monospace;letter-spacing:2px;transform:skew(-5deg)}

/* High-score topper */
.scores{
  position:relative;padding:13px 46px 15px;
  border-bottom:4px solid var(--cyan);
  background:linear-gradient(180deg,#111,#080808);
}
.scores-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.scores h2{margin:0;color:var(--yellow);font:900 16px monospace;letter-spacing:1px}
.status{color:var(--cyan);font:bold 9px monospace;letter-spacing:1px}
.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.score-card{
  position:relative;min-width:0;padding:8px 7px 9px;text-align:center;
  border:1px solid #333;border-bottom:3px solid #222;
  background:linear-gradient(#121212,#090909);
}
.score-card:first-child{border-color:var(--yellow);box-shadow:inset 0 0 0 1px rgba(255,216,0,.18)}
.rank{color:#666;font:bold 9px monospace}
.score-card:first-child .rank{color:var(--yellow)}
.player{margin:3px 0;color:#fff;font:900 15px monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.points{color:var(--cyan);font:900 16px monospace}

/* Screen bezel */
.game{
  position:relative;margin:18px 38px 20px;
  padding:9px;
  border:4px solid #242424;border-radius:10px;
  background:#020202;
  box-shadow:inset 0 0 0 2px #000,0 0 0 2px #151515;
}
.game:before{
  content:"GAME SCREEN";position:absolute;z-index:4;top:-12px;left:50%;transform:translateX(-50%);
  padding:3px 10px;background:#080808;color:#555;font:bold 8px monospace;letter-spacing:2px
}
.game iframe{display:block;width:100%;height:760px;border:0;border-radius:3px;background:#000}

/* Control panel */
.footer{
  position:relative;margin:0 38px 22px;padding:12px 16px;
  text-align:center;color:#aaa;font:bold 10px monospace;line-height:1.6;
  border:2px solid #222;border-radius:8px;background:#0d0d0d;
}
.footer:before{
  content:"HOW TO PLAY";position:absolute;top:-9px;left:16px;
  background:#080808;padding:0 7px;color:var(--yellow);font:bold 9px monospace
}
.footer b{color:var(--cyan)}

@media(max-width:760px){
  .arcade{padding:7px 5px 16px}
  .cabinet{border-width:3px;border-radius:10px;box-shadow:0 0 0 3px #111,0 0 0 5px var(--yellow)}
  .cabinet:before,.cabinet:after{width:7px}
  .marquee{padding:12px 20px 11px}
  .marquee:before,.marquee:after{display:none}
  .brand{font-size:9px;letter-spacing:3px}
  .title{font-size:38px;text-shadow:3px 3px #222,5px 5px var(--cyan)}
  .sub{font-size:8px;padding:4px 8px}
  .scores{padding:9px 12px 10px}
  .scores h2{font-size:12px}.status{font-size:7px}
  .score-grid{grid-template-columns:repeat(5,minmax(82px,1fr));overflow-x:auto;gap:5px;padding-bottom:3px}
  .score-card{padding:6px 5px}.player{font-size:12px}.points{font-size:13px}
  .game{margin:11px 11px 13px;padding:5px;border-width:3px}
  .game iframe{height:720px}
  .footer{margin:0 11px 13px;padding:10px 8px;font-size:8px}
}

/* CABINET V3 — DISTINCT ARCADE TYPOGRAPHY
   Deliberately different from the monospace/pixel typography inside BMX MAYHEM. */
.marquee .brand{
  font-family:"Arial Black",Impact,sans-serif !important;
  font-style:italic;
  font-weight:900 !important;
  letter-spacing:7px !important;
  transform:skew(-8deg);
  text-shadow:2px 2px 0 #000;
}

.marquee .title{
  font-family:Impact,"Arial Black",sans-serif !important;
  font-style:italic;
  font-weight:900 !important;
  letter-spacing:2px !important;
  color:#ffd800 !important;
  -webkit-text-stroke:2px #050505;
  text-shadow:
    3px 3px 0 #00e7e7,
    6px 6px 0 #111,
    9px 9px 0 #333 !important;
  transform:skew(-7deg) scaleX(1.04);
}

.marquee .sub{
  font-family:"Arial Black",Impact,sans-serif !important;
  font-style:italic;
  letter-spacing:3px !important;
  transform:skew(-8deg) !important;
}

.scores h2{
  font-family:Impact,"Arial Black",sans-serif !important;
  font-style:italic;
  font-weight:900 !important;
  letter-spacing:2px !important;
  text-transform:uppercase;
}

.score-card .rank{
  font-family:"Arial Black",Impact,sans-serif !important;
  font-style:italic;
  letter-spacing:1px;
}
.score-card .player{
  font-family:"Arial Black",Impact,sans-serif !important;
  font-style:italic;
  letter-spacing:1px;
}
.score-card .points{
  font-family:Impact,"Arial Black",sans-serif !important;
  font-style:italic;
  letter-spacing:1px;
  color:#ffd800 !important;
  text-shadow:2px 2px 0 #222;
}

.game:before,
.footer:before{
  font-family:"Arial Black",Impact,sans-serif !important;
  font-style:italic;
  letter-spacing:2px !important;
}

.footer{
  font-family:Arial,Helvetica,sans-serif !important;
  font-weight:800 !important;
  letter-spacing:.4px;
}

@media(max-width:760px){
  .marquee .brand{letter-spacing:4px !important}
  .marquee .title{
    letter-spacing:1px !important;
    -webkit-text-stroke:1px #050505;
    text-shadow:2px 2px 0 #00e7e7,4px 4px 0 #111,6px 6px 0 #333 !important;
  }
}

body{
 background:

 border-radius:8px !important;

}

</style></head><body><div class="arcade"><section class="cabinet"><header class="marquee"><div class="brand">PRESS START ARCADE</div><div class="title">BMX MAYHEM</div><div class="sub">GLOBAL HIGH SCORE CHALLENGE</div></header><section class="scores"><div class="scores-head"><h2>🏆 RIDERS TO BEAT — TOP 5</h2><span class="status" id="status">LOADING SCORES…</span></div><div class="score-grid" id="scoreGrid"></div></section><div class="game"><iframe src="https://pedalpowergarage.github.io/BMX-Mayhem/" title="BMX MAYHEM" allow="fullscreen" loading="eager"></iframe></div><footer class="footer"><b>DESKTOP:</b> ↑ JUMP / ↑↑ BIG AIR &nbsp; ↓ PUMP &nbsp; ← MANUAL &nbsp; → TURBO &nbsp; • &nbsp; <b>TOUCH:</b> USE THE IN-GAME D-PAD</footer></section></div>
<script>
const API='https://script.google.com/macros/s/AKfycbySyGnfJZVX0vRGrJXHcnrMnSd-lGVEIh_Hjxa_4g9sqoKspdPau7DTLkcyUkrP61C7/exec',grid=document.getElementById('scoreGrid'),statusEl=document.getElementById('status');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(rows){const a=(Array.isArray(rows)?rows:[]).slice().sort((x,y)=>Number(y.score||0)-Number(x.score||0)||Number(x.time||999999)-Number(y.time||999999)).slice(0,5);grid.innerHTML='';for(let i=0;i<5;i++){const r=a[i],d=document.createElement('div');d.className='score-card';d.innerHTML=r?`<div class="rank">#${i+1}</div><div class="player">${esc(r.playerCode||'RIDER')}</div><div class="points">${Number(r.score||0).toLocaleString()}</div>`:`<div class="rank">#${i+1}</div><div class="player">---</div><div class="points">-----</div>`;grid.appendChild(d)}statusEl.textContent=a.length?'LIVE GLOBAL SCORES':'NO SCORES YET'}
function loadScores(){const cb='psCabinet_'+Date.now(),s=document.createElement('script');let done=false;function clean(){try{delete window[cb]}catch(e){};s.remove()}window[cb]=r=>{done=true;render(r);clean()};s.onerror=()=>{statusEl.textContent='LEADERBOARD OFFLINE';clean()};s.src=API+'?callback='+cb+'&_='+Date.now();document.head.appendChild(s);setTimeout(()=>{if(!done){statusEl.textContent='LEADERBOARD OFFLINE';clean()}},7000)}
loadScores();setInterval(loadScores,30000);
</script></body></html>
