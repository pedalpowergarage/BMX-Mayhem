/* Live score panel */
.scores{
  margin:0 24px;padding:12px 18px 15px;
  background:#080808;border-left:3px solid #00e7e7;border-right:3px solid #00e7e7;
  border-bottom:4px solid #222
}
.scores-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.scores-head h2{margin:0;font:900 18px Arial,sans-serif;color:#f5f5f5;letter-spacing:.5px}
.scores-head h2 span{color:#00e7e7}
.status{font:900 10px Arial,sans-serif;color:#ffd800;letter-spacing:1px}
.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.score-card{padding:9px 8px;text-align:center;border:2px solid #00e7e7;background:#0d0d0d;box-shadow:4px 4px 0 #000}
.score-card:first-child{background:#ffd800;border-color:#fff;box-shadow:5px 5px 0 #00e7e7}
.rank{font:900 10px Arial,sans-serif;color:#888}
.player{margin:3px 0;font:900 15px Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.points{font:900 18px Arial,sans-serif;color:#ffd800}
.score-card:first-child .rank,.score-card:first-child .player,.score-card:first-child .points{color:#050505}

/* Cabinet body with real side-art strips */
.screen-zone{
  position:relative;display:grid;grid-template-columns:86px minmax(0,1fr) 86px;
  background:#050505

  .scores{margin:0 10px;padding:9px 10px 11px}
  .scores-head h2{font-size:14px}
  .score-card{padding:6px 5px}
  .player{font-size:12px} .points{font-size:14px}
  .screen-zone{grid-template-columns:42px minmax(0,1fr) 42px}
  .side-art{min-height:640px}
  .game-bezel{margin:10px 8px 12px;padding:6px;border-width:4px}
  .game-bezel iframe{height:min(680px,72vh)}
  .deck{height:105px}
}

/* Phones: hide decorative rails/deck so the actual game remains usable */
@media (max-width:699px){
  .wrap{padding:4px}
  .cabinet{border-width:2px;box-shadow:0 0 0 2px #111,0 0 0 4px #ffd800}
  .marquee{height:130px;background-size:cover}
  .scores{margin:0 5px;padding:8px}
  .scores-head{display:block;text-align:center}
  .status{display:block;margin-top:4px}
  .score-grid{grid-template-columns:repeat(5,minmax(74px,1fr));overflow-x:auto;gap:5px}
  .screen-zone{display:block}
  .side-art{display:none}
  .game-bezel{margin:8px;padding:3px;border-width:3px}
  .game-bezel iframe{height:72vh;min-height:590px}
  .deck{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="cabinet">
    <div class="marquee" aria-label="PRESS START ARCADE — BMX MAYHEM"></div>

    <section class="scores">
      <div class="scores-head">
        <h2><span>🌐</span> GLOBAL HIGH SCORES — TOP 5 RIDERS</h2>
        <span class="status" id="status">LOADING SCORES…</span>
      </div>
      <div class="score-grid" id="scoreGrid"></div>
    </section>

    <div class="screen-zone">
      <div class="side-art left-art" aria-hidden="true"></div>
      <div class="game-bezel">
        <iframe src="https://pedalpowergarage.github.io/BMX-Mayhem/" title="BMX MAYHEM" allow="fullscreen" loading="eager"></iframe>
      </div>
      <div class="side-art right-art" aria-hidden="true"></div>
    </div>

    <div class="deck" aria-hidden="true"></div>
  </section>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbySyGnfJZVX0vRGrJXHcnrMnSd-lGVEIh_Hjxa_4g9sqoKspdPau7DTLkcyUkrP61C7/exec';
const grid=document.getElementById('scoreGrid'),statusEl=document.getElementById('status');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(rows){
  const a=(Array.isArray(rows)?rows:[]).slice().sort((x,y)=>Number(y.score||0)-Number(x.score||0)||Number(x.time||999999)-Number(y.time||999999)).slice(0,5);
  grid.innerHTML='';
  for(let i=0;i<5;i++){
    const r=a[i],d=document.createElement('div');d.className='score-card';
    d.innerHTML=r
      ? `<div class="rank">#${i+1}</div><div class="player">${esc(r.playerCode||'RIDER')}</div><div class="points">${Number(r.score||0).toLocaleString()}</div>`
      : `<div class="rank">#${i+1}</div><div class="player">---</div><div class="points">-----</div>`;
    grid.appendChild(d);
  }
  statusEl.textContent=a.length?'LIVE GLOBAL SCORES':'NO SCORES YET';
}
function loadScores(){
  const cb='psCabinet_'+Date.now(),s=document.createElement('script');let done=false;
  function clean(){try{delete window[cb]}catch(e){};s.remove()}
  window[cb]=r=>{done=true;render(r);clean()};
  s.onerror=()=>{statusEl.textContent='LEADERBOARD OFFLINE';clean()};
  s.src=API+'?callback='+cb+'&_='+Date.now();
  document.head.appendChild(s);
  setTimeout(()=>{if(!done){statusEl.textContent='LEADERBOARD OFFLINE';clean()}},7000);
}
loadScores();
setInterval(loadScores,30000);
</script>
</body>
</html>
